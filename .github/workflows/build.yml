name: Build Trilion for Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest requests numpy pillow
      - run: python -m pytest -q tests

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller trilion.spec --noconfirm
      - name: Build installer (single Setup .exe)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\trilion.iss
      - name: Portable zip
        run: Compress-Archive -Path dist\Trilion -DestinationPath dist\Trilion-portable.zip -CompressionLevel Optimal
      - name: Show sizes
        run: Get-ChildItem dist\*.exe, dist\*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - name: Publish GitHub Release (fast CDN download)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Trilion ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Download `Trilion-Setup.exe`**, run it, then launch Trilion from the desktop shortcut.
            The first launch downloads the AI models once (about 6 GB) with a progress bar.
            `Trilion-portable.zip` is the same app without an installer.
          files: |
            dist/Trilion-Setup.exe
            dist/Trilion-portable.zip
      - name: Publish Trilion v0.7.0 from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          target_commitish: ${{ github.sha }}
          name: Trilion v0.7.0
          generate_release_notes: true
          body: |
            ## Trilion v0.7.0 — Command Center Edition

            A complete command-center interface redesign inspired by the JARVIS dashboard.

            - New dark command-center dashboard with live activity, system overview, agent modules, mission timeline, memory insights, and quick commands.
            - New animated 3D wireframe neural core with orbital rings and nodes.
            - Core animation reacts to live microphone input and voice output, and reflects listening, thinking, speaking, and acting states.
            - NEURAL, FOCUS, and AURORA visual themes recolor the interface without changing assistant, model, or safety settings.
            - Existing local AI, voice, vision, safety confirmations, tray, and keyboard controls remain connected.

            **Install:** Download `Trilion-Setup.exe`, run it, and launch Trilion from the desktop shortcut.
            **Portable:** Download `Trilion-portable.zip` and extract it to a folder of your choice.
            First launch downloads the local AI and speech models.
          files: |
            dist/Trilion-Setup.exe
            dist/Trilion-portable.zip
          fail_on_unmatched_files: true
      - name: Keep a copy as an Actions artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Trilion-Windows
          path: |
            dist/Trilion-Setup.exe
            dist/Trilion-portable.zip
          compression-level: 0
