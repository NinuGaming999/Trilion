name: Build Trilion for Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Build app
        run: pyinstaller trilion.spec --noconfirm
      - name: Build installer (single Setup .exe)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\trilion.iss
      - name: Portable zip
        run: Compress-Archive -Path dist\Trilion -DestinationPath dist\Trilion-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Trilion-Windows
          path: |
            dist/Trilion-Setup.exe
            dist/Trilion-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Trilion-Setup.exe
            dist/Trilion-portable.zip
