name: Build Trilion for Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest requests numpy pillow
      - run: python -m pytest -q tests

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller trilion.spec --noconfirm
      - name: Build installer (single Setup .exe)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\trilion.iss
      - name: Portable zip
        run: Compress-Archive -Path dist\Trilion -DestinationPath dist\Trilion-Beta-portable.zip -CompressionLevel Optimal
      - name: Show sizes
        run: Get-ChildItem dist\*.exe, dist\*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - name: Publish GitHub Release (fast CDN download)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Trilion ${{ github.ref_name }} (beta - new Command Center interface)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            **BETA - installs next to your normal Trilion as "Trilion Beta".** Download `Trilion-Beta-Setup.exe`, run it, then launch *Trilion Beta*. Run only one Trilion at a time (they share your GPU and settings).
            The first launch downloads the AI models once (about 6 GB) with a progress bar.
            `Trilion-Beta-portable.zip` is the same beta without an installer.
          files: |
            dist/Trilion-Beta-Setup.exe
            dist/Trilion-Beta-portable.zip
      - name: Keep a copy as an Actions artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Trilion-Windows
          path: |
            dist/Trilion-Beta-Setup.exe
            dist/Trilion-Beta-portable.zip
          compression-level: 0
