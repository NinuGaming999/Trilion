<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trilion - Avatar</title>
<script type="importmap">{"imports":{"three":"/avatar/static/lib/three.module.min.js","three/addons/":"/avatar/static/lib/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#dff0ff;background:radial-gradient(ellipse at 50% 35%,#0c1a33 0%,#050a16 55%,#02040a 100%)}
#stage{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,40,60,0) 30%,rgba(255,30,50,.55) 100%);transition:opacity .3s}
#hud{position:fixed;left:16px;top:14px;display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7fc8ff;pointer-events:none}
#hud b{color:#19d3ff}
#mood{width:150px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#moodfill{height:100%;width:0;background:linear-gradient(90deg,#34ffaa,#ffbf40,#ff3b4e);transition:width .25s}
#bubble{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);max-width:min(640px,86vw);padding:10px 18px;border-radius:14px;
 background:rgba(6,18,40,.72);border:1px solid rgba(25,211,255,.45);font-size:17px;line-height:1.35;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#bubble.show{opacity:1}#bubble.angry{border-color:rgba(255,59,78,.8);color:#ffd9dd}
#bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;width:min(560px,90vw)}
#bar input{flex:1;background:rgba(6,18,40,.8);border:1px solid rgba(40,150,255,.5);border-radius:10px;padding:10px 14px;color:#eaf6ff;font:inherit;outline:none}
#bar input:focus{border-color:#19d3ff}
#bar button{background:rgba(14,56,108,.85);border:1px solid rgba(40,170,255,.6);border-radius:10px;color:#e8f6ff;padding:0 16px;font:inherit;cursor:pointer}
#bar button:hover{background:rgba(24,96,170,.9)}
#load{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#04070f;z-index:5;transition:opacity .6s}
#load.done{opacity:0;pointer-events:none}
#loadbar{width:260px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#loadfill{height:100%;width:0;background:linear-gradient(90deg,#19d3ff,#9b6bff)}
#loadtxt{font-size:13px;color:#7fc8ff;letter-spacing:.12em}
#hint{position:fixed;right:16px;top:14px;font-size:11px;color:#5d86b3;text-align:right;line-height:1.5;pointer-events:none}
</style></head>
<body>
<div id="vig"></div><canvas id="stage"></canvas>
<div id="hud"><b>TRILION</b><span id="stat">idle</span><div id="mood"><div id="moodfill"></div></div></div>
<div id="hint">drag to look around &middot; scroll to zoom &middot; F full body, B bust<br>touch her... carefully</div>
<div id="bubble"></div>
<form id="bar" autocomplete="off"><input id="say" placeholder="Talk to her..." maxlength="300"><button>Send</button></form>
<div id="load"><div id="loadtxt">Waking up...</div><div id="loadbar"><div id="loadfill"></div></div></div>
<script>window.TRILION_TOKEN="__TOKEN__";window.TRILION_CONFIG=__CONFIG__;</script>
<script type="module" src="/avatar/static/avatar.js"></script>
</body></html>
